<!DOCTYPE html>

  <meta charset="UTF-8">
  <title>Hiring Partners Layout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #ffe6f0; /* light pink background */
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }

    .container h2 {
      font-size: 32px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .container p {
      font-size: 20px;
      margin-bottom: 40px;
      color: #444;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* fixed 4 columns for equal spacing */
      gap: 30px; /* equal spacing between boxes */
      margin-bottom: 40px;
    }

    .grid .logo-box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100px; /* fixed height for equal boxes */
      transition: transform 0.2s ease;
    }

    .grid .logo-box:hover {
      transform: scale(1.05);
      border-color: #aaa;
    }

    .grid img {
      max-width: 80%;
      max-height: 60%;
      object-fit: contain;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: #333;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #555;
    }
  </style>
</head>
