<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator Layout</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .calculator {
      background: #222;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      width: 320px;
    }

    .display {
      background: #000;
      color: #0f0;
      font-size: 32px;
      text-align: right;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      font-size: 20px;
      font-weight: bold;
      padding: 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    /* Number buttons */
    .num {
      background: #fff;
      color: #000;
    }
    .num:hover {
      background: #ddd;
    }

    /* Operator buttons */
    .op {
      background: #000;
      color: #fff;
    }
    .op:hover {
      background: #444;
    }

    /* Clear button */
    .clear {
      background: #c00;
      color: #fff;
    }
    .clear:hover {
      background: #e00;
    }

    /* Equals button */
    .equals {
      background: #000;
      color: #fff;
      grid-column: 4; /* stays in operator column */
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">0</div>
    <div class="buttons">
      <button class="num">7</button>
      <button class="num">8</button>
      <button class="num">9</button>
      <button class="op">+</button>

      <button class="num">4</button>
      <button class="num">5</button>
      <button class="num">6</button>
      <button class="op">-</button>

      <button class="num">1</button>
      <button class="num">2</button>
      <button class="num">3</button>
      <button class="op">x</button>

      <button class="clear">C</button>
      <button class="num">0</button>
      <button class="op">/</button>
      <button class="equals">=</button>
    </div>
  </div>
</body>
</html>
