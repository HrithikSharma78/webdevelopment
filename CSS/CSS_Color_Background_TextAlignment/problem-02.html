<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasty Bites Restaurant</title>
</head>
<body>
  <!-- Header -->
  <header style="background-color:darkred; color:white; text-align:center; padding:20px;">
    <h1 style="margin:0; font-size:32px;">Tasty Bites Restaurant</h1>
    <p style="margin:5px 0 0; font-size:16px;">Good Food Makes a Better Mood</p>
  </header>

  <!-- Menu Section -->
  <main style="padding:20px;">
    <section style="background-color:#fff; padding:15px; margin-bottom:20px;">
      <h2 style="background-color:orange; color:white; text-align:center; padding:10px; margin:0;">
        Our Special Dishes
      </h2>
      <table style="width:100%; border-collapse:collapse; margin-top:15px; font-size:16px;">
        <tr style="background-color:#f2f2f2;">
          <th style="border:1px solid #ccc; padding:8px; text-align:left;">Dish</th>
          <th style="border:1px solid #ccc; padding:8px; text-align:left;">Type</th>
          <th style="border:1px solid #ccc; padding:8px; text-align:left;">Price</th>
        </tr>
        <tr>
          <td style="border:1px solid #ccc; padding:8px;">Margherita Pizza</td>
          <td style="border:1px solid #ccc; padding:8px;">Veg</td>
          <td style="border:1px solid #ccc; padding:8px;">₹249</td>
        </tr>
        <tr>
          <td style="border:1px solid #ccc; padding:8px;">Paneer Butter Masala</td>
          <td style="border:1px solid #ccc; padding:8px;">Veg</td>
          <td style="border:1px solid #ccc; padding:8px;">₹279</td>
        </tr>
        <tr>
          <td style="border:1px solid #ccc; padding:8px;">Chicken Biryani</td>
          <td style="border:1px solid #ccc; padding:8px;">Non-Veg</td>
          <td style="border:1px solid #ccc; padding:8px;">₹299</td>
        </tr>
        <tr>
          <td style="border:1px solid #ccc; padding:8px;">Chocolate Brownie</td>
          <td style="border:1px solid #ccc; padding:8px;">Dessert</td>
          <td style="border:1px solid #ccc; padding:8px;">₹149</td>
        </tr>
      </table>
    </section>

    <!-- Promotion -->
    <section style="background-color:#ffe6e6; text-align:center; padding:15px; margin-bottom:20px;">
      <p style="color:#b30000; font-size:18px; font-weight:bold;">
        Visit Us & Enjoy Delicious Food!
      </p>
    </section>
  </main>

  <!-- Footer -->
  <footer style="background-color:#4d2600; color:white; text-align:center; padding:15px;">
    <p style="margin:0; font-size:16px;">Open Daily: 11 AM – 11 PM</p>
  </footer>
</body>
</html>
