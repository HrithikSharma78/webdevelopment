<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Holiday</title>
</head>
<body>
  <!-- Header -->
  <header style="background-color:#1a73e8; color:#ffffff; text-align:center; padding:20px;">
    <h1 style="margin:0; font-size:32px;">Bright Future School</h1>
    <p style="margin:5px 0 0; font-size:16px;">Learn Today, Lead Tomorrow</p>
  </header>

  <!-- Main Content -->
  <main style="padding:20px;">
    <section style="background-color:#ffffff; padding:15px; margin-bottom:20px;">
      <h2 style="color:rgb(246,27,7); text-align:center;">Holiday Notice</h2>
      <p style="color:#000000; text-align:left;">
        This is to inform all the students that the school will remain closed on 
        <strong>5th September</strong> on the occasion of Teachers’ Day.
      </p>
    </section>

    <!-- Greeting -->
    <section style="background-color:#ffccff; text-align:center; padding:15px;">
      <p style="color:purple; font-size:18px; font-weight:bold;">
        Wishing all our teachers a very<br>Happy Teachers’ Day!
      </p>
    </section>

    <!-- Footer -->
    <footer style="background-color:#009933; text-align:center; padding:15px;">
      <p style="color:yellow; font-size:16px;">Stay Safe, Stay Happy!</p>
      <p style="color:yellow; font-weight:bold;">School Management</p>
    </footer>
  </main>
</body>
</html>
