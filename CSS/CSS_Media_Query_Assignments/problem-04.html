<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Grid Layout</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .grid-container {
      display: grid;
      grid-template-areas:
        "nav nav"
        "left right1"
        "left right2"
        "left right3";
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      min-height: 100vh;
      padding: 20px;
    }

    .nav {
      grid-area: nav;
      background: yellow;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
    }

    .left {
      grid-area: left;
      background: red;
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .right1 {
      grid-area: right1;
      background: green;
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .right2 {
      grid-area: right2;
      background: green;
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .right3 {
      grid-area: right3;
      background: green;
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Medium screens: stack right boxes horizontally under left */
    @media (max-width: 992px) {
      .grid-container {
        grid-template-areas:
          "nav nav"
          "left left"
          "right1 right2"
          "right3 right3";
        grid-template-columns: 1fr 1fr;
      }
    }

    /* Small screens: stack everything vertically */
    @media (max-width: 600px) {
      .grid-container {
        grid-template-areas:
          "nav"
          "left"
          "right1"
          "right2"
          "right3";
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="nav">Navigation</div>
    <div class="left">LEFT BOX</div>
    <div class="right1">RIGHT BOX 1</div>
    <div class="right2">RIGHT BOX 2</div>
    <div class="right3">RIGHT BOX 3</div>
  </div>
</body>
</html>
